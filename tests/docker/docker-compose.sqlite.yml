# Nextcloud with SQLite for testing

services:
  nextcloud:
    image: nextcloud:29
    container_name: files_labels_test_sqlite
    ports:
      - "8081:80"
    volumes:
      # No named volume on /var/www/html — image's writable layer is fine for
      # ephemeral test runs and avoids the "Cannot write into 'apps' directory"
      # install failure caused by volume-init permissions on GHA runners.
      - ../../:/var/www/html/custom_apps/files_labels:ro
      # Pre-install hook: re-chown apps/config/data so occ maintenance:install
      # can write to them under GHA's overlay2 storage.
      - ./hooks/pre-installation:/docker-entrypoint-hooks.d/pre-installation:ro
    environment:
      - SQLITE_DATABASE=nextcloud
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=admin
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
