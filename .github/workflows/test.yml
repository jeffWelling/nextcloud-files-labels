name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: test-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm run test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  php-tests:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} / ${{ matrix.database }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
        database: ['sqlite', 'mysql', 'pgsql']
        nextcloud: ['29']
        include:
          - database: sqlite
            db_port: 0
          - database: mysql
            db_port: 3306
          - database: pgsql
            db_port: 5432

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: nextcloud
          MYSQL_DATABASE: nextcloud
          MYSQL_USER: nextcloud
          MYSQL_PASSWORD: nextcloud
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pnextcloud"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: nextcloud
          POSTGRES_USER: nextcloud
          POSTGRES_PASSWORD: nextcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nextcloud -d nextcloud"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, zip, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Checkout Nextcloud
        uses: actions/checkout@v4
        with:
          repository: nextcloud/server
          ref: stable${{ matrix.nextcloud }}
          path: nextcloud

      - name: Checkout submodules
        working-directory: nextcloud
        run: |
          git submodule update --init

      - name: Install app
        run: |
          mkdir -p nextcloud/apps/files_labels
          cp -r appinfo lib composer.json nextcloud/apps/files_labels/ 2>/dev/null || true
          cp -r src templates css img nextcloud/apps/files_labels/ 2>/dev/null || true

      - name: Setup Nextcloud
        working-directory: nextcloud
        run: |
          if [ "${{ matrix.database }}" = "sqlite" ]; then
            php occ maintenance:install \
              --admin-user=admin \
              --admin-pass=admin \
              --database=sqlite
          elif [ "${{ matrix.database }}" = "mysql" ]; then
            php occ maintenance:install \
              --admin-user=admin \
              --admin-pass=admin \
              --database=mysql \
              --database-host=127.0.0.1 \
              --database-name=nextcloud \
              --database-user=nextcloud \
              --database-pass=nextcloud
          elif [ "${{ matrix.database }}" = "pgsql" ]; then
            php occ maintenance:install \
              --admin-user=admin \
              --admin-pass=admin \
              --database=pgsql \
              --database-host=127.0.0.1 \
              --database-name=nextcloud \
              --database-user=nextcloud \
              --database-pass=nextcloud
          fi

      - name: Enable app
        working-directory: nextcloud
        run: php occ app:enable files_labels

      - name: Run PHPUnit
        working-directory: nextcloud/apps/files_labels
        run: |
          composer install --no-interaction
          if [ -f phpunit.xml ] || [ -f phpunit.xml.dist ]; then
            vendor/bin/phpunit
          else
            echo "No PHPUnit configuration found, skipping"
          fi

  e2e-tests:
    runs-on: ubuntu-latest
    name: E2E / ${{ matrix.database }}
    strategy:
      fail-fast: false
      matrix:
        # E2E exercises the UI and OCS HTTP layer — DB engine doesn't matter
        # there. Cross-DB compatibility is already covered by the PHP × DB
        # PHPUnit matrix. Keep E2E to sqlite only (cuts ~10 CI minutes/push).
        database: ['sqlite']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Start test environment
        run: |
          docker compose -f tests/docker/docker-compose.${{ matrix.database }}.yml up -d
          PORT=8081

          # Workaround: Docker creates the bind-mount parent
          # /var/www/html/custom_apps as root:root, and Nextcloud's apps_paths
          # default expects custom_apps writable by www-data. The pre-install
          # hook can't fix this — it runs as www-data and gets "Operation not
          # permitted" on chown. So we exec as root from the workflow.
          # Wait briefly for the container to be ready for exec, then chown.
          for i in 1 2 3 4 5; do
            if docker exec --user root files_labels_test_${{ matrix.database }} \
                  chown www-data:www-data /var/www/html/custom_apps 2>/dev/null; then
              echo "Fixed custom_apps ownership after ${i} attempt(s)"
              break
            fi
            sleep 2
          done

          # Wait for Nextcloud, probing every 4s and dumping state every 30s
          for i in $(seq 1 90); do
            if curl -sf "http://localhost:$PORT/status.php" > /dev/null 2>&1; then
              echo "Nextcloud ready after $((i*4))s"
              curl -s "http://localhost:$PORT/status.php"; echo
              exit 0
            fi
            if [ $((i % 8)) -eq 0 ]; then
              echo "=== waited ~$((i*4))s, container state: ==="
              docker compose -f tests/docker/docker-compose.${{ matrix.database }}.yml ps
              echo "=== curl probe: ==="
              curl -s -o /tmp/body -w "HTTP %{http_code} - size %{size_download}B\n" "http://localhost:$PORT/status.php" || true
              echo "=== body (first 500B): ==="
              head -c 500 /tmp/body 2>/dev/null; echo
            fi
            sleep 4
          done
          echo "::error::Nextcloud never returned 200 from /status.php within 360s"
          exit 1

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "=== docker compose ps ==="
          docker compose -f tests/docker/docker-compose.${{ matrix.database }}.yml ps -a
          echo "=== docker compose logs ==="
          docker compose -f tests/docker/docker-compose.${{ matrix.database }}.yml logs --tail=400

      - name: Enable app
        run: |
          CONTAINER=files_labels_test_${{ matrix.database }}
          docker exec -u www-data $CONTAINER php occ app:enable files_labels

      - name: Create test users for Playwright
        # global-setup.ts logs in as testuser1/testuser2 — they don't exist
        # on a fresh install. The default `testpass123` is in HIBP's
        # compromised list and Nextcloud refuses to create accounts with it,
        # so use a unique passphrase and forward the same value to Playwright
        # via TEST_PASSWORD / TEST_PASSWORD_2 below.
        run: |
          CONTAINER=files_labels_test_${{ matrix.database }}
          for user in testuser1 testuser2; do
            docker exec --env OC_PASS="${E2E_PASSWORD}" -u www-data $CONTAINER \
              php occ user:add --password-from-env --display-name "$user" "$user"
          done
        env:
          E2E_PASSWORD: 'e2e-NotAPwnedPass!2026'

      - name: Run E2E tests
        run: npx playwright test
        env:
          # global-setup.ts navigates to ${NEXTCLOUD_URL}/login directly,
          # so we have to set NEXTCLOUD_URL too — PLAYWRIGHT_BASE_URL only
          # affects `use.baseURL` for individual tests.
          NEXTCLOUD_URL: http://localhost:8081
          PLAYWRIGHT_BASE_URL: http://localhost:8081
          TEST_PASSWORD: 'e2e-NotAPwnedPass!2026'
          TEST_PASSWORD_2: 'e2e-NotAPwnedPass!2026'

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.database }}
          path: |
            playwright-report/
            test-results/

      - name: Stop test environment
        if: always()
        run: docker compose -f tests/docker/docker-compose.${{ matrix.database }}.yml down -v
