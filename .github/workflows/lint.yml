name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: lint-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  php-lint:
    runs-on: ubuntu-latest
    name: PHP Lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: PHP syntax check
        run: find lib/ -name "*.php" -print0 | xargs -0 -n1 php -l

  php-cs:
    runs-on: ubuntu-latest
    name: PHP Code Style
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: php-cs-fixer
          coverage: none

      - name: Run PHP-CS-Fixer
        if: hashFiles('.php-cs-fixer.dist.php') != ''
        run: php-cs-fixer fix --dry-run --diff

  js-lint:
    runs-on: ubuntu-latest
    name: JavaScript Lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        if: hashFiles('.eslintrc.js', '.eslintrc.json', '.eslintrc.yml') != ''
        run: npm run lint

  info-xml:
    runs-on: ubuntu-latest
    name: Validate info.xml
    steps:
      - uses: actions/checkout@v4

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Validate info.xml against the Nextcloud apps schema
        run: |
          if [ ! -f appinfo/info.xml ]; then
            exit 0
          fi
          # apps.nextcloud.com/schema/... is currently 404; pull the canonical
          # XSD from the nextcloud/server repo. Fall back to a plain
          # well-formedness check if the fetch fails so a network blip doesn't
          # take down the lint job.
          if curl -fsSL -o /tmp/info.xsd \
              https://raw.githubusercontent.com/nextcloud/server/master/resources/app-info.xsd; then
            xmllint --noout --schema /tmp/info.xsd appinfo/info.xml
          else
            echo "::warning::Could not fetch app-info.xsd; falling back to well-formedness check"
            xmllint --noout appinfo/info.xml
          fi

  npm-audit:
    runs-on: ubuntu-latest
    name: npm audit (runtime)
    # Informational only: every current advisory chains back to Vue 2 (EOL)
    # or its transitive ecosystem and is unfixable without Nextcloud upstream's
    # Vue 3 migration. We surface the report in CI logs but don't gate PRs on
    # it. Promote to a hard gate once @nextcloud/vue v9+ lands here.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  composer-audit:
    runs-on: ubuntu-latest
    name: composer audit
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Audit PHP dependencies
        run: composer audit --no-interaction
